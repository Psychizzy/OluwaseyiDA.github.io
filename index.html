<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajayi Oluwaseyi Portfolio</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      transition: background 0.4s, color 0.4s;
    }

    :root {
      --bg: #ffffff;
      --text: #0a0a0a;
    }

    [data-theme="dark"] {
      --bg: #0a1a2f;
      --text: #e0e0e0;
    }

    .toggle-btn {
      position: fixed;
      top: 10px;
      right: 20px;
      background-color: #0077b6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }

    img {
      max-width: 90%;
      border-radius: 10px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <button class="toggle-btn" id="theme-toggle">🌙 Toggle Theme</button>

  <div id="content">
    <!-- You can copy-paste your README.md content here (about, projects, etc.) -->
  </div>

  <script>
    const btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', () => {
      document.body.dataset.theme = document.body.dataset.theme === 'dark' ? '' : 'dark';
    });
  </script>
</body>
</html>
